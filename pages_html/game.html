<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="60x60" href="/favicon.png">
    <title>Game Memory</title>
    <script type="module" src="/src/game.ts"></script>
    <style>
        html {
            visibility: hidden;
        }
    </style>
</head>

<body>

    <section class="game-wrapper">

        <header class="game-header">
            <nav class="game-header__nav">

                <section class="player-scores">
                    <div class="player-scores__player player-scores__player--blue">
                        <img class="player-scores__icon"
                            src="/assets/img/themes/code-vibe-theme/blue-right-flash-code.svg" alt="">
                        <span class="player-scores__name">Blue</span>
                        <span class="player-scores__points">0</span>
                    </div>
                    <div class="player-scores__player player-scores__player--orange">
                        <img class="player-scores__icon"
                            src="/assets/img/themes/code-vibe-theme/orange-right-flash-code.svg" alt="">
                        <span class="player-scores__name">Orange</span>
                        <span class="player-scores__points">0</span>
                    </div>
                </section>

                <section class="current-player">
                    <span class="current-player__label">Current player :</span>
                    <img class="current-player__icon" src="/assets/img/themes/code-vibe-theme/blue-right-flash-code.svg"
                        alt="">
                </section>

                <button id="open-quit-dialog" class="exit-game" aria-haspopup="dialog">
                    <img class="exit-game__icon" src="/assets/img/themes/code-vibe-theme/exit-code-vibe.svg" alt=""
                        aria-hidden="true">
                    <span class="exit-game__text">Exit game</span>
                </button>
            </nav>
        </header>

        <section class="cards-grid">


        </section>
        
    </section>


    <dialog id="quit-dialog" class="quit-dialog">
        <form method="dialog" class="quit-dialog__container">
            <h2 class="quit-dialog__title">Are you sure you want to quit the game?</h2>

            <div class="quit-dialog__actions">
                <button type="submit" value="cancel" class="quit-dialog__button quit-dialog__button--primary">
                    Back to game
                </button>
                <button type="submit" value="confirm" class="quit-dialog__button quit-dialog__button--secondary">
                    Exit game
                </button>
            </div>
        </form>
    </dialog>

   
    <!-- Game over diaolg -->

<dialog id="game-over-dialog" class="game-over-dialog">
    <div class="game-over-dialog__container">
        
        <img  class="game-over-dialog__img" src="/assets/img/game-over/game_over.svg" alt="Game Over Image">
        
        <p class="game-over-dialog__subtitle">Final Score</p>
        
        <div class="game-over-dialog__scores">
            
            <div class="game-over-dialog__player">
                <img src="/assets/img/themes/code-vibe-theme/blue-right-flash-code.svg" 
                     alt="" class="game-over-dialog__icon">
                <span class="game-over-dialog__name">Blue</span>
                <span class="game-over-dialog__points">0</span>
            </div>

            <div class="game-over-dialog__player">
                <img src="/assets/img/themes/code-vibe-theme/orange-right-flash-code.svg" 
                     alt="" class="game-over-dialog__icon">
                <span class="game-over-dialog__name">Orange</span>
                <span class="game-over-dialog__points">0</span>
            </div>
   
</dialog>

<!-- dialog WInner is -->

<dialog id="winner-dialog" class="winner-dialog">
    <div class="winner-dialog__container">
        
        <img src="/assets/img/themes/code-vibe-theme/confetti.svg" 
             alt="" class="winner-dialog__confetti">
        
        <p class="winner-dialog__subtitle">The winner is</p>
        
        <h1 class="winner-dialog__name">Orange Player</h1>
        
        <img src="/assets/img/themes/code-vibe-theme/orange-right-flash-code.svg" 
             alt="" class="winner-dialog__icon">
        
        <button class="winner-dialog__btn">Back to start</button>

    </div>
</dialog>

</body>

</html>
